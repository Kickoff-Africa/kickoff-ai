# Self-hosted llama.cpp for kickoff-ai (LLM_BACKEND=llamacpp).
# Two llama-server processes: chat (:8080) and embeddings (:8081). Models are
# downloaded from Hugging Face on first start into the `models` volume, so
# redeploys don't re-download. Nothing here calls an external AI service.
#
# Deploy: in Coolify add a "Docker Compose" resource pointing at this file
# (or `docker compose -f deploy/llamacpp/docker-compose.yml up -d`), then set
# the backend's env to the service names below:
#   LLM_BACKEND=llamacpp
#   LLAMACPP_BASE_URL=http://llama-chat:8080
#   LLAMACPP_EMBED_BASE_URL=http://llama-embed:8081
# (the app must share the compose network, or use the container hostnames
# Coolify shows for these services.)
#
# Tune via env: CHAT_MODEL (HF repo:quant), CTX_SIZE, THREADS.
services:
  llama-chat:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    command: >
      -hf ${CHAT_MODEL:-Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080
      -c ${CTX_SIZE:-4096}
      -t ${THREADS:-4}
      --parallel 1
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s   # first start downloads the model

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    command: >
      -hf ${EMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5-GGUF:Q8_0}
      --embeddings
      --host 0.0.0.0 --port 8081
      -c 2048
      -t 2
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s

volumes:
  models:
